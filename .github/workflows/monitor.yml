name: Monitor de Ingressos Chape x Vasco

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-ingressos
  cancel-in-progress: true

jobs:
  checar-ingressos:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache do navegador Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Instalar pacotes Python e Chromium
        run: |
          pip install playwright requests
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Executar verificação da página
        run: python monitor.py
